name: CI/CD — NFT Minting Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  UPDATE_SNAPSHOTS: "true"

jobs:
  # ── Job 1: Build & Test Smart Contracts ──────────────────────────────────────
  build-and-test:
    name: Build & Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 🔨 Step 1 - Build WASM Contract
        working-directory: ./contract
        run: cargo build --target wasm32-unknown-unknown --release

      - name: ✅ Step 2 - Run Smart Contract Tests
        working-directory: ./contract
        run: cargo test --workspace -- --nocapture

      - name: 📤 Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soroban-nft-contracts-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore

  # ── Job 2: Frontend Validation & Linting ─────────────────────────────────────
  frontend-check:
    name: Validate Frontend DApp
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🌐 Verify Frontend Files Structure
        run: |
          test -f frontend/index.html && echo "✅ index.html present"
          test -f frontend/app.js    && echo "✅ app.js present"
          test -f frontend/soroban.js && echo "✅ soroban.js present"
          test -f frontend/style.css && echo "✅ style.css present"

      - name: 🔍 Syntax Validation for JavaScript
        run: |
          node -c frontend/app.js
          node -c frontend/soroban.js
          echo "✅ All JavaScript files passed syntax verification!"