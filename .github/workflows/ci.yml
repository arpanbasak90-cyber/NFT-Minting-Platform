name: CI/CD — NFT Minting Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test Contracts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust toolchain
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - name: 📦 Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🔨 Build NFT contract
        working-directory: ./contract
        run: cargo build --verbose

      - name: 🔨 Build NFT Registry contract
        working-directory: ./contract
        run: cargo build --verbose --package registry

      - name: ✅ Run all tests
        working-directory: ./contract
        run: cargo test --verbose 2>&1 | tee test-results.txt

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: contract/test-results.txt

  # ── Job 2: WASM Build & Validation Workflow ─────────────────────────
  deploy:
    name: Build WASM & Deploy Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust toolchain
        run: |
          rustup update stable
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - name: 📦 Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 🔧 Build WASM Target
        working-directory: ./contract
        run: |
          cargo build --target wasm32-unknown-unknown --release

      - name: 📤 Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: nft-contract-wasm
          path: contract/target/wasm32-unknown-unknown/release/*.wasm

      - name: 🚀 Validate Contract Deployment Ready
        run: |
          echo "WASM compilation verified successfully. Ready for Stellar Testnet deployment."

  # ── Job 3: Frontend Validation & CI ──────────────────────────────────────────
  frontend-check:
    name: Validate & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🌐 Check frontend files & structure
        run: |
          test -f frontend/index.html && echo "✅ index.html exists" || exit 1
          test -f frontend/app.js    && echo "✅ app.js exists"     || exit 1
          test -f frontend/soroban.js && echo "✅ soroban.js exists" || exit 1
          test -f frontend/style.css && echo "✅ style.css exists"  || exit 1

      - name: 🔍 Syntax check JS files
        run: |
          node -c frontend/app.js
          node -c frontend/soroban.js
          echo "✅ JavaScript syntax validation passed!"