name: CI/CD — NFT Minting Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: Smart Contract Tests ───────────────────────────────────────────────
  smart-contract-tests:
    name: Build & Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 📦 Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contract

      - name: ✅ Run Smart Contract Unit Tests
        working-directory: ./contract
        run: cargo test --workspace

      - name: 🔨 Build WASM Contracts (release)
        working-directory: ./contract
        run: cargo build --target wasm32-unknown-unknown --release

      - name: 📤 Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-nft-contracts-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore

  # ── Job 2: Frontend Validation ────────────────────────────────────────────────
  frontend-check:
    name: Validate Frontend DApp
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🌐 Verify Frontend File Structure
        run: |
          test -f frontend/index.html  && echo "✅ index.html present"
          test -f frontend/app.js      && echo "✅ app.js present"
          test -f frontend/soroban.js  && echo "✅ soroban.js present"
          test -f frontend/style.css   && echo "✅ style.css present"

      - name: 🔍 JavaScript Syntax Validation
        run: |
          node -c frontend/app.js
          node -c frontend/soroban.js
          echo "✅ All JavaScript files passed syntax validation!"